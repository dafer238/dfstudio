[workspace]
resolver = "2"
members = ["crates/dfcore", "crates/dfcli", "crates/dfapp"]

[workspace.package]
version = "1.2.0"
edition = "2021"
authors = ["Daniel Pérez"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/dafer238/dfstudio"
homepage = "https://github.com/dafer238/dfstudio"
description = "Equation-oriented solver for engineering models and thermodynamic cycles"
rust-version = "1.85"

[workspace.dependencies]
dfcore = { path = "crates/dfcore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
coolprop-sys = "8"
flate2 = "1"
crc32fast = "1"
libm = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
