name: Bug report
description: Something does not work, crashes or gives a wrong result.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model
      description: The smallest script that shows the problem (paste it, or attach a .dfs or .df file). Please remove confidential data.
      render: text
  - type: input
    id: version
    attributes:
      label: DF Studio version
      description: Shown at the bottom of the Help menu.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
