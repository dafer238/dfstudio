name: Model does not solve
description: A model that should solve fails, converges slowly or gives a result you doubt.
labels: [solver]
body:
  - type: textarea
    id: model
    attributes:
      label: Model
      description: The script (or attach the .df project). Please remove confidential data.
      render: text
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message
      description: The status-bar message, e.g. "block 12 (2 eq.) did not converge for ...".
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Reference values and their source (another program, tables, measurements), if any.
  - type: input
    id: version
    attributes:
      label: DF Studio version
    validations:
      required: true
