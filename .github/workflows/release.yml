name: Release

# Push a tag `vX.Y.Z` (matching the version in Cargo.toml) to build the
# installers for Windows, macOS and Linux and publish them as a GitHub
# release. Pull requests that change the packaging, and manual runs
# (Actions > Release > Run workflow), build the packages as workflow
# artifacts without publishing anything.
#
# Windows code signing (SignPath Foundation, see CODE_SIGNING.md) runs only
# when the secret SIGNPATH_API_TOKEN and the variable SIGNPATH_ORGANIZATION_ID
# are set, and only for a tag push or a manual run with a signing policy
# chosen. Each signing request waits for a manual approval in SignPath.
# Without them the workflow builds unsigned packages, as before.

on:
  push:
    tags: ["v*"]
  # build (but do not publish) the packages when the packaging changes
  pull_request:
    paths: ["packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      signing_policy:
        description: "Sign the Windows files with this SignPath policy (needs the SignPath secret)"
        type: choice
        options: [none, test-signing, release-signing]
        default: none

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  linux:
    needs: check-version
    # The prebuilt CoolProp library needs glibc >= 2.38: build on Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --release
      - run: packaging/linux/build_appimage.sh dist
      - name: Smoke test
        run: |
          chmod +x dist/DeltaF_Studio-*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 dist/DeltaF_Studio-*.AppImage dfs run examples/rankine.dfs > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/DeltaF_Studio-*.AppImage
          if-no-files-found: error

  macos:
    needs: check-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --release
      - run: packaging/macos/build_app.sh dist
      - name: Smoke test
        run: '"dist/DeltaF Studio.app/Contents/MacOS/dfs" run examples/rankine.dfs > /dev/null'
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: check-version
    runs-on: windows-latest
    env:
      # 'true' when this run signs the Windows files with SignPath
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && (startsWith(github.ref, 'refs/tags/') || (inputs.signing_policy != '' && inputs.signing_policy != 'none')) }}
      SIGNPATH_POLICY: ${{ (inputs.signing_policy != '' && inputs.signing_policy != 'none') && inputs.signing_policy || vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A signed build must come from a clean build of this commit: no cache
      # from earlier, unverified runs (SignPath origin verification).
      - uses: Swatinem/rust-cache@v2
        if: env.SIGN != 'true'
      - run: cargo test --workspace --locked --release
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Version
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Build and stage the files
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -StageOnly
      - name: No Visual C++ runtime dependency
        shell: pwsh
        run: |
          # The runners have the VC++ Redistributable, users' machines may not:
          # check the imports instead of relying on the smoke tests.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          foreach ($f in Get-ChildItem dist\windows\stage\*.exe, dist\windows\stage\*.dll) {
            $deps = & $dumpbin.FullName /nologo /dependents $f.FullName | Select-String -Pattern '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
            Write-Host "$($f.Name): $($deps -join ', ')"
            $bad = $deps | Where-Object { $_ -match '^(vcruntime|msvcp|concrt|vcomp)\d*' }
            if ($bad) { throw "$($f.Name) needs the Visual C++ Redistributable: $($bad -join ', ')" }
          }

      # Sign dfstudio.exe and dfs.exe before they go into the installer and
      # the portable zip (SignPath artifact configuration "executables").
      - name: Upload the executables for signing
        id: unsigned-exes
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-executables
          path: |
            dist/windows/stage/dfstudio.exe
            dist/windows/stage/dfs.exe
          if-no-files-found: error
      - name: Sign the executables (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'dfstudio' }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: executables
          github-artifact-id: ${{ steps.unsigned-exes.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/windows/signed-exes
          parameters: |
            version: "${{ steps.version.outputs.version }}"
      - name: Put the signed executables in the stage
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          foreach ($exe in 'dfstudio.exe', 'dfs.exe') {
            $f = "dist\windows\signed-exes\$exe"
            $sig = Get-AuthenticodeSignature $f
            if (-not $sig.SignerCertificate) { throw "$exe came back unsigned" }
            Write-Host "$exe : $($sig.Status) ($($sig.SignerCertificate.Subject))"
            Copy-Item $f dist\windows\stage -Force
          }

      - name: Build the installer and the portable zip
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -PackageOnly

      # Sign the installer itself (SignPath artifact configuration "installer").
      - name: Upload the installer for signing
        id: unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/*-setup.exe
          if-no-files-found: error
      - name: Sign the installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'dfstudio' }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/windows/signed-installer
          parameters: |
            version: "${{ steps.version.outputs.version }}"
      - name: Replace the installer with the signed one
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $f = Get-ChildItem dist\windows\signed-installer\*-setup.exe
          if ($f.Count -ne 1) { throw "expected one signed installer, got $($f.Count)" }
          $sig = Get-AuthenticodeSignature $f.FullName
          if (-not $sig.SignerCertificate) { throw "the installer came back unsigned" }
          Write-Host "$($f.Name) : $($sig.Status) ($($sig.SignerCertificate.Subject))"
          Copy-Item $f.FullName dist -Force

      - name: Smoke test (per-user install, PATH, associations, uninstall)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe).FullName
          $app = "$env:LOCALAPPDATA\Programs\DeltaF Studio"
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/LOG=install.log' -Wait
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if (($path -split ';') -notcontains $app) { Get-Content install.log; throw "install folder not on the user PATH: $path" }
          & "$app\dfs.exe" run examples\rankine.dfs > $null
          if ($LASTEXITCODE -ne 0) { throw "dfs failed" }
          foreach ($ext in '.df', '.dfs', '.ees') {
            if (-not (Test-Path "HKCU:\Software\Classes\$ext")) { throw "$ext not associated" }
          }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\DeltaF Studio.lnk")) { throw "no Start menu entry" }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          # the uninstaller re-launches itself from %TEMP%, so -Wait returns early
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\unins000.exe"); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 2
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if (($path -split ';') -contains $app) { throw "install folder still on the PATH after uninstall: $path" }
          if (Test-Path "HKCU:\Software\Classes\DFStudio.EES") { throw ".ees association left after uninstall" }
      - name: MSIX package (Microsoft Store)
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\msix\build_msix.ps1 -TestSign
      - name: Smoke test MSIX (install, dfstudio alias, uninstall)
        shell: pwsh
        run: |
          # the test copy is signed with a throwaway certificate; trust it for this machine only
          Import-Certificate -FilePath dist\windows\msix-test\test-cert.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $msix = (Get-ChildItem dist\windows\msix-test\*.msix).FullName
          Add-AppxPackage -Path $msix
          $pkg = Get-AppxPackage | Where-Object { $_.Name -eq (Get-Content packaging\windows\msix\store-identity.json -Raw | ConvertFrom-Json).IdentityName }
          if (-not $pkg) { throw "MSIX package not installed" }
          Write-Host "installed $($pkg.PackageFullName) in $($pkg.InstallLocation)"
          foreach ($f in 'dfstudio.exe', 'CoolProp.dll', 'resources.pri', 'examples') {
            if (-not (Test-Path (Join-Path $pkg.InstallLocation $f))) { throw "$f missing from the package" }
          }
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps\dfstudio.exe"
          if (-not (Test-Path $alias)) { throw "dfstudio alias not registered" }
          # solves every built-in template with CoolProp from the package and saves it
          $out = Join-Path $env:RUNNER_TEMP "msix-examples"
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process -FilePath $alias -ArgumentList "--write-examples", "`"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "dfstudio --write-examples (MSIX) failed ($($p.ExitCode))" }
          if (-not (Get-ChildItem $out -Filter *.df)) { throw "no examples written by the MSIX app" }
          Remove-AppxPackage -Package $pkg.PackageFullName
      - uses: actions/upload-artifact@v4
        with:
          name: msix-store
          path: dist/*.msix
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The Store package (msix-store) is not a release download: it is
      # uploaded to Partner Center, which signs it (docs/STORE_AND_WINGET.md).
      - run: rm -f dist/*.msix
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'MD'

          ### Downloads

          | System | File |
          |---|---|
          | Windows 10/11 (x64) | `*-windows-x64-setup.exe` (installer; all users or current user) or `*-windows-x64-portable.zip` |
          | macOS 11+ (Apple silicon and Intel) | `*-macos-universal.dmg` (first launch: right-click > Open) |
          | Linux (x86-64, glibc 2.38+, e.g. Ubuntu 24.04) | `*-linux-x86_64.AppImage` (`chmod +x`, then run) |

          `SHA256SUMS.txt` lists the checksums of all files.
          Code signing policy: https://deltafstudio.com/code-signing
          MD
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: DeltaF Studio ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true

  # Submit the new version to winget (a pull request to microsoft/winget-pkgs
  # from a fork of it). Runs only when the WINGET_TOKEN secret exists: a classic
  # personal access token with the public_repo scope, of an account that has
  # forked microsoft/winget-pkgs. The first version has to be in winget-pkgs
  # already (packaging/winget/README.md).
  winget:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-22.04
    env:
      KOMAC_VERSION: 2.17.2
      GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Update the winget manifest
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::notice::WINGET_TOKEN is not set: winget not updated"
            exit 0
          fi
          version=${GITHUB_REF_NAME#v}
          curl -sSLf -o komac.tar.gz "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf komac.tar.gz komac
          if ! ./komac list dafer238.DeltaFStudio > /dev/null 2>&1; then
            echo "::notice::dafer238.DeltaFStudio is not in microsoft/winget-pkgs yet (first version pending): winget not updated"
            exit 0
          fi
          ./komac update dafer238.DeltaFStudio --version "$version" \
            --urls "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/DeltaF_Studio-$version-windows-x64-setup.exe" \
            --release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --submit
