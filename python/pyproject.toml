[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dfpy"
version = "0.1.0"
description = "Read DF Studio .df project files for post-processing in Python"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
pandas = ["pandas"]

[tool.setuptools]
packages = ["dfpy"]
